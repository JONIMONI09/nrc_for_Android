plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'net.kdt.pojavlaunch.firefly'
    compileSdk 35
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "net.kdt.pojavlaunch.noriskk"
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName "1.0-Noriskk"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debug {
            // storeFile file("debug.keystore")
            // storePassword "android"
            // keyAlias "androiddebugkey"
            // keyPassword "android"
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            signingConfig signingConfigs.debug
            resValue "string", "curseforge_api_key", ""
            resValue "string", "base_version_code", "1"
            resValue "string", "application_package", "net.kdt.pojavlaunch.noriskk.debug"
            resValue "string", "storageProviderAuthorities", "net.kdt.pojavlaunch.noriskk.scoped.gamefolder.debug"
            resValue "string", "fileProviderAuthorities", "net.kdt.pojavlaunch.noriskk.scoped.FileFileProvider.debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            resValue "string", "curseforge_api_key", ""
            resValue "string", "base_version_code", "1"
            resValue "string", "application_package", "net.kdt.pojavlaunch.noriskk"
            resValue "string", "storageProviderAuthorities", "net.kdt.pojavlaunch.noriskk.scoped.gamefolder"
            resValue "string", "fileProviderAuthorities", "net.kdt.pojavlaunch.noriskk.scoped.FileFileProvider"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    buildFeatures {
        prefab true
        buildConfig true
    }

    packagingOptions {
        doNotStrip "**/libterm-boot.so"
        jniLibs {
            useLegacyPackaging = false
            pickFirsts += ['**/libbytehook.so']
        }
    }

    externalNativeBuild {
        ndkBuild {
            path file("src/main/jni/Android.mk")
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.webkit:webkit:1.8.0'

    implementation "javax.annotation:javax.annotation-api:1.3.2"
    implementation "commons-codec:commons-codec:1.15"
    implementation "androidx.preference:preference:1.2.0"
    implementation "androidx.drawerlayout:drawerlayout:1.2.0"
    implementation "androidx.viewpager2:viewpager2:1.1.0-beta01"
    implementation "androidx.annotation:annotation:1.5.0"
    implementation "androidx.documentfile:documentfile:1.0.1"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"

    implementation "com.bytedance:bytehook:1.0.10"
    implementation "com.github.duanhong169:checkerboarddrawable:1.0.2"
    implementation 'com.intuit.sdp:sdp-android:1.1.1'
    implementation 'com.intuit.ssp:ssp-android:1.1.1'
    // implementation "com.github.PojavLauncherTeam:portrait-sdp:ed33e89cbc"
    // implementation "com.github.PojavLauncherTeam:portrait-ssp:6c02fd739b"
    implementation "com.github.Mathias-Boulay:ExtendedView:1.0.0"
    implementation "com.github.Mathias-Boulay:android_gamepad_remapper:2.0.3"
    implementation "com.github.Mathias-Boulay:virtual-joystick-android:1.14"
    // implementation "com.github.megatronking.stringfog:xor:5.0.0" // Skiping stringfog for now to avoid plugin complexity
    implementation "com.squareup.okhttp3:okhttp:3.9.1"

    implementation "net.sourceforge.htmlcleaner:htmlcleaner:2.6.1"

    implementation "org.commonmark:commonmark:0.18.2"
    implementation "org.commonmark:commonmark-ext-gfm-tables:0.18.2"
    implementation "org.greenrobot:eventbus:3.3.1"
    implementation "org.tukaani:xz:1.8"

    implementation "top.fifthlight.touchcontroller:proxy-client-android:0.0.4"

    implementation("com.moandjiezana.toml:toml4j:0.7.2") {
        exclude group: "com.google.code.gson", module: "gson"
    }

    implementation("io.noties.markwon:core:4.6.2") {
        exclude group: "com.atlassian.commonmark", module: "commonmark"
    }
    implementation("io.noties.markwon:image:4.6.2") {
        exclude group: "com.atlassian.commonmark", module: "commonmark"
    }
    implementation("io.noties.markwon:image-glide:4.6.2") {
        exclude group: "com.atlassian.commonmark", module: "commonmark"
    }

    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])
}
